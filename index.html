["17/11/2025","008","บันทึกข้อความ","ธุรการ","แผนและงบประมาณ","หัวหน้าสำนักงานเลขาคณบดี","ผช.อาคารสถานที่","","ดำเนินการ","ภายใน","","นางสาวพัชนี คำวงษา"],

<script>
/* ══════════ UTIL ══════════ */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const openM=h=>{modalBody.innerHTML=h;modal.classList.remove('hidden')};
const closeM=()=>modal.classList.add('hidden');
const SC={'สำเร็จ':{b:'bg-emerald-50 text-emerald-700 border-emerald-200',d:'#10b981'},
 'ดำเนินการ':{b:'bg-blue-50 text-blue-700 border-blue-200',d:'#2563eb'},
 'แก้ไข':{b:'bg-amber-50 text-amber-700 border-amber-200',d:'#f59e0b'},
 'ยกเลิก':{b:'bg-slate-100 text-slate-500 border-slate-200',d:'#94a3b8'},
 'ไม่ระบุ':{b:'bg-violet-50 text-violet-700 border-violet-200',d:'#8b5cf6'}};
const TC={'เกินกำหนด':'bg-rose-50 text-rose-700 border-rose-200','ใกล้ครบกำหนด':'bg-orange-50 text-orange-700 border-orange-200',
 'ปกติ':'bg-emerald-50 text-emerald-700 border-emerald-200','เสร็จแล้ว':'bg-slate-50 text-slate-500 border-slate-200',
 'ยกเลิก':'bg-slate-50 text-slate-400 border-slate-200'};
const TI={'เกินกำหนด':'🔴','ใกล้ครบกำหนด':'🟠','ปกติ':'🟢','เสร็จแล้ว':'✅','ยกเลิก':'—'};
const sb=s=>(SC[s]||SC['ไม่ระบุ']).b, tb=t=>TC[t]||TC['ปกติ'];
const D0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
function parseDate(x){
  if(x instanceof Date) return isNaN(x)?null:x;
  const s=String(x||'').trim(); if(!s) return null;
  const p=s.split(',')[0].trim().split(/[\/\-]/); if(p.length!==3) return null;
  let d,m,y;
  if(p[0].length===4){y=+p[0];m=+p[1];d=+p[2];} else {d=+p[0];m=+p[1];y=+p[2];}
  if(y>2400) y-=543;
  const dt=new Date(y,m-1,d); return isNaN(dt)?null:dt;
}
const fmt=d=>d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'-';
const dkey=d=>d?d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate():0;

let ROWS=[], KPI={}, Q='', FS='', FT='';
/* หน้าติดตามเฉพาะเรื่อง: เปิดผ่านลิงก์ ?no=หมายเลขหนังสือ (สแกนจาก QR ในใบปะหน้า) */
const TRACK_NO=new URLSearchParams(location.search).get('no');
if(TRACK_NO){ document.body.classList.add('track-mode'); trackView.classList.remove('hidden'); }

/* ══════════ โหลดข้อมูลจาก Google Sheets (gviz) ══════════ */
async function loadData(){
  /* เปิดไฟล์นี้ตรงๆ จากเครื่อง (file://) เบราว์เซอร์จะบล็อกการ fetch ข้ามโดเมนไปหา
     Google เสมอ (นี่คือสาเหตุที่พบบ่อยที่สุดของ "Failed to fetch" — ไม่เกี่ยวกับสิทธิ์แชร์ชีตเลย)
     ต้องเปิดไฟล์นี้ผ่านเว็บเซิร์ฟเวอร์ (http/https) เช่น GitHub Pages, Netlify, Google Sites
     (แทรกเป็น iframe/HTML) หรือรันเซิร์ฟเวอร์ทดสอบในเครื่องเอง (เช่น `python3 -m http.server`) */
  if(location.protocol==='file:'){
    build(FALLBACK); live.classList.add('hidden');
    warn.classList.remove('hidden');
    warn.innerHTML='⚠️ <b>ไม่สามารถดึงข้อมูลสดได้เพราะเปิดไฟล์นี้แบบไฟล์ในเครื่อง (file://)</b> — '+
     'ขณะนี้แสดงข้อมูลสำรอง · เบราว์เซอร์บล็อกการเชื่อมต่อออกไปหา Google เสมอเมื่อเปิดไฟล์ตรงๆ แบบนี้ '+
     '(ไม่เกี่ยวกับการตั้งค่าแชร์ของชีต) · <b>วิธีแก้:</b> อัปโหลดไฟล์นี้ขึ้นเว็บโฮสติ้ง เช่น GitHub Pages / Netlify / Google Sites '+
     'แล้วเปิดผ่าน URL แบบ https:// แทน';
    return;
  }
  try{
    const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&gid='+GID+'&_='+Date.now();
    const res=await fetch(url);
    if(!res.ok) throw new Error('เซิร์ฟเวอร์ตอบกลับ HTTP '+res.status);
    const txt=await res.text();
    if(/^\s*</.test(txt)) throw new Error('ชีตยังไม่ได้แชร์แบบสาธารณะ หรือ GID="'+GID+'" ไม่ตรงกับแท็บที่ต้องการ');
    const s=txt.indexOf('{'), e=txt.lastIndexOf('}');
    if(s<0||e<0) throw new Error('รูปแบบข้อมูลที่ได้ไม่ถูกต้อง');
    const j=JSON.parse(txt.substring(s,e+1));
    if(j.status==='error') throw new Error((j.errors&&j.errors[0]&&j.errors[0].detailed_message)||'Google Sheets ปฏิเสธคำขอ');
    if(!j.table||!j.table.cols) throw new Error('ไม่พบตารางข้อมูล (ตรวจสอบ GID ของแท็บ)');
    const cols=j.table.cols.map(c=>String(c.label||'').trim());
    const raw=j.table.rows.map(r=>{ const o={};
      (r.c||[]).forEach((c,i)=>{ o[cols[i]] = c ? (c.f!=null?c.f:c.v) : ''; }); return o; });
    const list=raw.filter(o=>String(o['หมายเลขหนังสือ']||'').trim())
      .map(o=>[o['วันที่เริ่มงาน'],o['หมายเลขหนังสือ'],o['เรื่อง'],o['ผู้รับ'],o['หัวหน้ากลุ่มงาน'],
        o['หัวหน้าสำนักงานเลขาคณบดี'],o['ผู้บริหาร'],o['คณบดี'],o['สถานะ'],o['ประเภท'],o['วันที่งานสำเร็จ'],o['ชื่อผู้รับเรื่อง']]);
    if(!list.length) throw new Error('ไม่พบข้อมูลในชีต (ตรวจสอบชื่อหัวคอลัมน์ให้ตรงกับที่ระบบต้องการ)');
    build(list); warn.classList.add('hidden');
    live.classList.remove('hidden'); lsync.textContent='อัปเดต '+new Date().toLocaleTimeString('th-TH');
  }catch(e){
    build(FALLBACK); live.classList.add('hidden');
    warn.classList.remove('hidden');
    const netHint=(e instanceof TypeError)?' · หากขึ้นข้อความนี้ทั้งที่แชร์ถูกต้องแล้ว มักเกิดจากเปิดไฟล์แบบ file:// หรือเครือข่าย/ไฟร์วอลล์บล็อก docs.google.com':'';
    warn.innerHTML='⚠️ <b>ยังดึงข้อมูลสดจาก Google Sheets ไม่ได้</b> ('+esc(e.message)+') — ขณะนี้แสดงข้อมูลสำรอง · '+
     'วิธีแก้: เปิดชีต → <b>แชร์</b> → <b>ทุกคนที่มีลิงก์ = ผู้อ่าน</b>'+netHint;
  }
}
/* ══════════ แปลงข้อมูล + คำนวณ KPI ══════════ */
function build(list){
  const T=D0(new Date());
  ROWS=list.map((a,i)=>{
    const owners={'ผู้รับ':a[3]||'','หัวหน้ากลุ่มงาน':a[4]||'','หัวหน้าสำนักงานเลขาคณบดี':a[5]||'',
      'ผู้บริหาร':a[6]||'','คณบดี':a[7]||''};
    const status=String(a[8]||'').trim()||'ไม่ระบุ';
    const closed=(status==='สำเร็จ'||status==='ยกเลิก');
    const sd=parseDate(a[0]); let ed=parseDate(a[10]);
    if(!closed) ed=null;
    const days=sd?Math.round((D0(ed||T)-D0(sd))/86400000):'';
    const sla=slaOf(a[2]);
    const over=(!closed&&days!=='')?Math.max(0,days-sla):0;
    const passed=STAGES.filter(g=>String(owners[g.c]||'').trim()).length;
    const nextStage=STAGES.find(g=>!String(owners[g.c]||'').trim());
    let where = closed ? (status==='สำเร็จ'?'ดำเนินการครบทุกขั้นตอน':'ยุติเรื่องแล้ว')
      : status==='แก้ไข' ? 'ตีกลับ — รอผู้รับเรื่องแก้ไข'
      : nextStage ? 'รอ '+nextStage.c : 'รอสรุปปิดเรื่อง';
    return {no:String(a[1]).trim(), subject:a[2]||'-', owners:owners, status:status, type:a[9]||'-',
      start:sd, end:parseDate(a[10]), days:days, sla:sla, over:over, passed:passed, where:where, closed:closed,
      recip:a[11]||'', _seq:i,
      timeState: closed?(status==='สำเร็จ'?'เสร็จแล้ว':'ยกเลิก'):(over>0?'เกินกำหนด':((sla-days)<=1?'ใกล้ครบกำหนด':'ปกติ'))};
  }).sort((x,y)=> y._seq - x._seq);   /* เรื่องที่เพิ่มล่าสุด (แถวท้ายสุดของชีต) ขึ้นก่อนเสมอ ไม่ขึ้นกับวันที่เริ่มงาน */

  const c=s=>ROWS.filter(r=>r.status===s).length;
  const fin=ROWS.filter(r=>r.status==='สำเร็จ');
  KPI={total:ROWS.length, running:c('ดำเนินการ'), fixing:c('แก้ไข'), success:c('สำเร็จ'), cancel:c('ยกเลิก'),
    unknown:c('ไม่ระบุ'), watch:ROWS.filter(r=>!r.closed).length, closedN:ROWS.filter(r=>r.closed).length,
    over:ROWS.filter(r=>r.over>0).length, soon:ROWS.filter(r=>r.timeState==='ใกล้ครบกำหนด').length,
    inside:ROWS.filter(r=>r.type==='ภายใน').length, outside:ROWS.filter(r=>r.type==='ภายนอก').length,
    avg:fin.length?Math.round(fin.reduce((a,b)=>a+(+b.days||0),0)/fin.length):0,
    rate:ROWS.length?Math.round(c('สำเร็จ')/ROWS.length*100):0};
  if(TRACK_NO){ renderTrackView(); } else { render(); }
}
/* ══════════ RENDER ══════════ */
function render(){
  /* เก็บสถานะโฟกัส/ตำแหน่งเคอร์เซอร์ของช่องค้นหาไว้ก่อน เพราะ innerHTML ด้านล่าง
     จะสร้าง <input> ตัวใหม่ทับของเดิม ทำให้โฟกัสหลุดถ้าไม่ทำแบบนี้ */
  const _active=document.activeElement;
  const _isSearch=_active && _active.id==='searchQ';
  const _selStart=_isSearch?_active.selectionStart:null;
  const _selEnd=_isSearch?_active.selectionEnd:null;
  const K=KPI;
  hero.innerHTML=[['หนังสือทั้งหมด',K.total,'รายการในทะเบียน','text-white'],
   ['ต้องกำกับติดตาม',K.watch,'ยังไม่ปิดเรื่อง','text-amber-300'],
   ['ดำเนินการเสร็จสิ้น',K.success,'คิดเป็น '+K.rate+'% ของทั้งหมด','text-emerald-300'],
   ['ยกเลิก',K.cancel,'ยุติเรื่องแล้ว','text-slate-300']]
   .map(([l,v,s,c])=>`<div class="bg-white/10 border border-white/15 rounded-xl p-4">
    <div class="text-[12px] text-blue-200">${l}</div><div class="text-4xl font-bold ${c}">${v}</div>
    <div class="text-[11px] text-blue-200/80 mt-1">${s}</div></div>`).join('');

  const f=ROWS.filter(d=>(!Q||(d.no+' '+d.subject+' '+d.where).toLowerCase().includes(Q.toLowerCase()))
   &&(!FS||d.status===FS)&&(!FT||d.timeState===FT));

  /* ── ตารางทะเบียนหนังสือ (บนสุด เรียงล่าสุดก่อน) ── */
  const table=`<div class="card overflow-hidden mb-6">
   <div class="p-4 flex gap-2 flex-wrap items-center border-b border-slate-100">
    <div class="mr-auto"><h2 class="font-bold text-lg" style="color:var(--nv)">📚 ทะเบียนหนังสือ
     <span class="text-slate-400 font-normal text-sm">(${f.length}/${ROWS.length} รายการ · เรียงจากล่าสุด)</span></h2>
     <p class="text-xs text-slate-500">คลิกที่แถวเพื่อดูไทม์ไลน์ว่าหนังสืออยู่ขั้นตอนใด</p></div>
    <input id="searchQ" value="${esc(Q)}" oninput="Q=this.value;render()" placeholder="🔍 ค้นหาเลขที่ / เรื่อง" class="border border-slate-300 rounded-lg px-3 py-2 text-sm min-w-[190px]">
    <select onchange="FS=this.value;render()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
     ${['','ดำเนินการ','แก้ไข','สำเร็จ','ยกเลิก'].map(s=>`<option value="${s}" ${FS===s?'selected':''}>${s||'ทุกสถานะ'}</option>`).join('')}</select>
    <select onchange="FT=this.value;render()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
     ${['','ปกติ','ใกล้ครบกำหนด','เกินกำหนด','เสร็จแล้ว'].map(s=>`<option value="${s}" ${FT===s?'selected':''}>${s||'ทุกสถานะเวลา'}</option>`).join('')}</select>
    <button onclick="exportCSV()" class="border border-slate-300 px-3 py-2 rounded-lg text-sm">⬇ CSV</button></div>
   <div class="overflow-auto max-h-[560px]"><table class="w-full text-sm">
    <thead class="text-slate-600"><tr>
     <th class="p-3 text-left">เลขที่</th><th class="p-3 text-left">เรื่อง</th><th class="p-3">วันที่เริ่ม</th>
     <th class="p-3">ผ่านมา (วัน)</th><th class="p-3">กำหนด</th><th class="p-3">ความคืบหน้า</th>
     <th class="p-3 text-left">ขั้นตอนปัจจุบัน</th><th class="p-3">สถานะ</th><th class="p-3">เวลา</th><th class="p-3"></th></tr></thead><tbody>
    ${f.map(d=>`<tr class="border-t border-slate-100 hover:bg-blue-50/50 cursor-pointer ${d.over>0?'bg-rose-50/40':''}" onclick="detail('${d.no}')">
     <td class="p-3 font-mono font-bold text-slate-700">${esc(d.no)}</td>
     <td class="p-3"><div class="font-medium">${esc(d.subject)}</div><div class="text-xs text-slate-400">${esc(d.type)} · ผู้รับ: ${esc(d.owners['ผู้รับ']||'-')}</div></td>
     <td class="p-3 text-center text-slate-600 whitespace-nowrap">${fmt(d.start)}</td>
     <td class="p-3 text-center font-semibold">${d.days===''?'-':d.days}</td>
     <td class="p-3 text-center text-slate-400">${d.sla}</td>
     <td class="p-3"><div class="flex items-center gap-1 justify-center">
      ${STAGES.map((g,i)=>`<span title="${g.c}" class="w-2.5 h-2.5 rounded-full ${i<d.passed?'bg-emerald-500':(i===d.passed&&!d.closed?'bg-blue-600 pulse':'bg-slate-200')}"></span>`).join('')}
      <span class="text-xs text-slate-400 ml-1">${d.passed}/5</span></div></td>
     <td class="p-3 text-xs ${d.closed?'text-slate-400':'text-blue-700 font-medium'}">${esc(d.where)}</td>
     <td class="p-3 text-center"><span class="px-2 py-1 rounded-full text-xs border ${sb(d.status)}">${esc(d.status)}</span></td>
     <td class="p-3 text-center"><span class="px-2 py-1 rounded-full text-xs border whitespace-nowrap ${tb(d.timeState)}">${TI[d.timeState]||''} ${d.over>0?'เกิน '+d.over+' วัน':esc(d.timeState)}</span></td>
     <td class="p-3 text-right"><span class="text-blue-700 font-medium whitespace-nowrap">ดูสถานะ →</span></td></tr>`).join('')
     ||'<tr><td colspan="10" class="p-10 text-center text-slate-400">ไม่พบข้อมูลตามเงื่อนไข</td></tr>'}
   </tbody></table></div></div>`;

  /* ── KPI แถวย่อย ── */
  const kpi=(l,v,s,c,bg,br)=>`<div class="rounded-2xl p-4 border ${bg}" style="border-color:${br}">
   <div class="text-[12px] text-slate-500">${l}</div><div class="text-3xl font-bold ${c}">${v}</div>
   <div class="text-[11px] text-slate-400 mt-0.5">${s}</div></div>`;
  const kpiRow=`<div class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6">
   ${kpi('🔵 ดำเนินการ',K.running,'อยู่ระหว่างเสนอ','text-blue-700','bg-blue-50','#bfdbfe')}
   ${kpi('🟡 ต้องแก้ไข',K.fixing,'ถูกตีกลับ','text-amber-600','bg-amber-50','#fde68a')}
   ${kpi('🟢 สำเร็จ',K.success,K.rate+'% ของทั้งหมด','text-emerald-600','bg-emerald-50','#a7f3d0')}
   ${kpi('⚪ ยกเลิก',K.cancel,'ยุติเรื่อง','text-slate-500','bg-slate-50','#e2e8f0')}
   ${kpi('🔴 เกินกำหนด',K.over,'ต้องเร่งรัด','text-rose-600','bg-rose-50','#fecdd3')}
   ${kpi('⏱ เฉลี่ยปิดเรื่อง',K.avg+' วัน','เฉพาะที่สำเร็จ','text-slate-700','bg-white','#e2e8f0')}</div>`;

  /* ── โดนัทสถานะ ── */
  const t=ROWS.length||1, seg=[['สำเร็จ',K.success],['ดำเนินการ',K.running],['แก้ไข',K.fixing],['ยกเลิก',K.cancel],['ไม่ระบุ',K.unknown]];
  let acc=0,g=[]; seg.forEach(([k,v])=>{const a=acc,b=acc+(v||0)/t*100; if(v)g.push(SC[k].d+' '+a+'% '+b+'%'); acc=b;});
  const donut=`<div class="flex items-center gap-5">
   <div class="w-32 h-32 rounded-full shrink-0" style="background:conic-gradient(${g.join(',')||'#e2e8f0 0 100%'})">
    <div class="w-20 h-20 bg-white rounded-full m-6 flex flex-col items-center justify-center">
     <div class="text-xl font-bold" style="color:var(--nv)">${K.total}</div><div class="text-[10px] text-slate-500">เรื่อง</div></div></div>
   <div class="flex-1">${seg.filter(x=>x[1]).map(([k,v])=>`<div class="flex items-center justify-between text-sm py-1">
    <span class="flex items-center gap-2"><span class="w-3 h-3 rounded" style="background:${SC[k].d}"></span>${k}</span>
    <span><b>${v}</b> <span class="text-slate-400 text-xs">${Math.round(v/t*100)}%</span></span></div>`).join('')}</div></div>`;

  /* ── คิวค้างแต่ละขั้นตอน ── */
  const open=ROWS.filter(d=>!d.closed);
  const funnel=STAGES.map((s,i)=>{
    const done=ROWS.filter(d=>d.passed>i).length;
    const queue=open.filter(d=>d.passed===i).length;
    const pc=ROWS.length?Math.round(done/ROWS.length*100):0;
    return `<div class="mb-3"><div class="flex justify-between text-sm mb-1"><span>${s.i} ${s.c}</span>
     <span class="text-slate-500">ผ่าน ${done}/${ROWS.length}${queue?` · <b class="text-blue-700">คิว ${queue}</b>`:''}</span></div>
     <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-2.5 rounded-full" style="width:${pc}%;background:var(--bl)"></div></div></div>`;
  }).join('');

  /* ── รายการต้องกำกับติดตาม ── */
  const watchList=open.slice().sort((a,b)=>b.over-a.over).map(d=>
   `<div class="flex justify-between items-center border-b border-slate-100 py-2 text-sm cursor-pointer hover:bg-blue-50/50 px-1 rounded" onclick="detail('${d.no}')">
    <div><b class="font-mono text-slate-700">${esc(d.no)}</b> ${esc(d.subject)}
     <div class="text-xs text-blue-700">${esc(d.where)}</div></div>
    <div class="text-right shrink-0">${d.over>0?`<b class="text-rose-600">เกิน ${d.over} วัน</b>`:`<b class="text-blue-700">${d.days} วัน</b>`}
     <div class="text-xs text-slate-400">กำหนด ${d.sla} วัน</div></div></div>`).join('');

  /* ── หมวดหมู่เรื่อง + ประเภท ── */
  const cat={}; ROWS.forEach(d=>cat[d.subject]=(cat[d.subject]||0)+1);
  const catList=Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
   `<div class="flex items-center gap-2 text-sm py-1"><span class="w-36 truncate">${esc(k)}</span>
    <div class="flex-1 h-2 bg-slate-100 rounded-full"><div class="h-2 rounded-full" style="width:${v/ROWS.length*100}%;background:#60a5fa"></div></div>
    <b class="w-6 text-right">${v}</b></div>`).join('');
  const unitCount={}; ROWS.forEach(d=>{const u=d.owners['ผู้รับ']||'-';unitCount[u]=(unitCount[u]||0)+1});
  const unitList=Object.entries(unitCount).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
   `<div class="flex justify-between text-sm border-b border-slate-100 py-2"><span>👥 ${esc(k)}</span><b>${v} เรื่อง</b></div>`).join('');

  body.innerHTML = table + kpiRow + `
   <div class="grid md:grid-cols-3 gap-5 mb-6">
    <div class="card p-5"><h3 class="font-bold mb-4" style="color:var(--nv)">สัดส่วนสถานะหนังสือ</h3>${donut}
     <div class="mt-4 pt-3 border-t border-slate-100 text-sm space-y-1">
      <div class="flex justify-between"><span class="text-slate-500">ปิดเรื่องแล้ว</span><b>${K.closedN} เรื่อง</b></div>
      <div class="flex justify-between"><span class="text-slate-500">ยังต้องกำกับติดตาม</span><b class="text-amber-600">${K.watch} เรื่อง</b></div>
      <div class="flex justify-between"><span class="text-slate-500">ภายใน / ภายนอก</span><b>${K.inside} / ${K.outside}</b></div></div></div>
    <div class="card p-5"><h3 class="font-bold mb-4" style="color:var(--nv)">ความคืบหน้าตามลำดับขั้น</h3>${funnel}
     <p class="text-xs text-slate-400 mt-2">แถบ = จำนวนเรื่องที่ผ่านขั้นนั้นแล้ว · คิว = จำนวนเรื่องที่รออยู่</p></div>
    <div class="card p-5"><h3 class="font-bold mb-1" style="color:var(--nv)">📌 ต้องกำกับติดตาม ${K.watch} เรื่อง</h3>
     <p class="text-xs text-slate-500 mb-2">🔴 เกินกำหนด ${K.over} · 🟠 ใกล้ครบกำหนด ${K.soon}</p>
     ${open.length?watchList:'<p class="text-sm text-emerald-600 py-6 text-center">✅ ปิดเรื่องครบทุกรายการ</p>'}</div></div>
   <div class="grid md:grid-cols-2 gap-5">
    <div class="card p-5"><h3 class="font-bold mb-3" style="color:var(--nv)">จำแนกตามเรื่อง</h3>${catList}</div>
    <div class="card p-5"><h3 class="font-bold mb-3" style="color:var(--nv)">จำแนกตามผู้รับเรื่อง</h3>${unitList}</div></div>`;

  /* คืนโฟกัส + ตำแหน่งเคอร์เซอร์ให้ช่องค้นหา เพื่อให้พิมพ์ต่อเนื่องได้โดยไม่ต้องคลิกใหม่ทุกตัวอักษร */
  if(_isSearch){
    const el=document.getElementById('searchQ');
    if(el){ el.focus(); if(_selStart!=null) el.setSelectionRange(_selStart,_selEnd); }
  }
}

/* ══════════ ลิงก์ติดตามเฉพาะเรื่อง (เข้ารหัสใน QR) ══════════ */
const trackLink=no=>location.origin+location.pathname+'?no='+encodeURIComponent(no);

/* ══════════ การ์ดไทม์ไลน์ + สถานะของหนังสือ 1 เรื่อง (ใช้ร่วมกันทั้ง modal และหน้าติดตามจาก QR) ══════════ */
function docCardHTML(d, standalone){
  const tl=STAGES.map((g,i)=>{
    const owner=d.owners[g.c], on=!!String(owner||'').trim();
    const cur=!on&&!d.closed&&i===d.passed;
    return `<div class="flex gap-3"><div class="flex flex-col items-center">
     <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-sm ${on?'bg-emerald-500 text-white':cur?'text-white pulse':'bg-slate-100 text-slate-400'}" ${cur?'style="background:var(--bl)"':''}>${on?'✓':g.i}</div>
     ${i<4?`<div class="w-0.5 flex-1 my-1 ${on?'bg-emerald-400':'bg-slate-200'}"></div>`:''}</div>
     <div class="pb-5 flex-1"><div class="font-semibold ${cur?'text-blue-700':''}">${i+1}. ${g.c}
      ${cur?'<span class="text-xs bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-full ml-1">อยู่ระหว่างดำเนินการ</span>':''}</div>
      <div class="text-sm ${on?'text-slate-600':'text-slate-400'}">${on?'ผู้รับผิดชอบ: '+esc(owner):'ยังไม่ถึงขั้นตอนนี้'}</div></div></div>`;
  }).join('');
  return `<div class="${standalone?'card p-5':''}">
   <div class="flex justify-between items-start gap-3 mb-4">
    <div><div class="text-xs text-slate-500">หนังสือเลขที่</div>
     <div class="text-3xl font-bold" style="color:var(--nv)">${esc(d.no)}</div>
     <div class="font-medium mt-1">${esc(d.subject)}</div>
     <div class="text-sm text-slate-500">${esc(d.type)} · เริ่ม ${fmt(d.start)}</div>
     <div class="mt-2 flex gap-2 flex-wrap">
      <span class="px-3 py-1 rounded-full text-sm border ${sb(d.status)}">${esc(d.status)}</span>
      <span class="px-3 py-1 rounded-full text-sm border ${tb(d.timeState)}">${TI[d.timeState]||''} ${esc(d.timeState)}${d.over>0?' '+d.over+' วัน':''}</span>
      ${d.end?'<span class="px-3 py-1 rounded-full text-sm border bg-emerald-50 text-emerald-700 border-emerald-200">✅ ส่งคืนหนังสือ/งานสำเร็จเมื่อ '+esc(fmt(d.end))+'</span>':''}</div></div>
    ${standalone?'':'<button onclick="closeM()" class="text-3xl text-slate-400 leading-none">&times;</button>'}</div>
   <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 mb-4 text-sm">
    <b class="text-blue-800">ขั้นตอนปัจจุบัน:</b> ${esc(d.where)}</div>
   <div class="grid grid-cols-3 gap-3 mb-5 text-center">
    <div class="bg-blue-50 rounded-xl py-3"><div class="text-xs text-slate-500">ผ่านมา (วัน)</div><div class="text-2xl font-bold text-blue-700">${d.days===''?'-':d.days}</div><div class="text-xs text-slate-400">วัน</div></div>
    <div class="bg-slate-50 rounded-xl py-3"><div class="text-xs text-slate-500">กำหนดแล้วเสร็จ</div><div class="text-2xl font-bold text-slate-700">${d.sla}</div><div class="text-xs text-slate-400">วัน</div></div>
    <div class="${d.over>0?'bg-rose-50':'bg-emerald-50'} rounded-xl py-3"><div class="text-xs text-slate-500">เกินกำหนด</div><div class="text-2xl font-bold ${d.over>0?'text-rose-600':'text-emerald-600'}">${d.over}</div><div class="text-xs text-slate-400">วัน</div></div></div>
   <div class="mb-4"><div class="flex justify-between text-xs text-slate-500 mb-1"><span>ความคืบหน้า</span><span>${d.passed}/5 ขั้นตอน</span></div>
    <div class="h-3 bg-slate-100 rounded-full overflow-hidden"><div class="h-3 rounded-full" style="width:${d.passed/5*100}%;background:${d.over>0?'#e11d48':'#1d4ed8'}"></div></div></div>
   <h3 class="font-bold mb-3" style="color:var(--nv)">ไทม์ไลน์การเสนอหนังสือ</h3>${tl}
   <div class="flex gap-2 flex-wrap mt-5 pt-4 border-t border-slate-100 noprint">
    <button onclick="printCover('${esc(d.no)}')" class="text-sm border border-slate-300 rounded-lg px-3 py-2 hover:bg-slate-50">🖨 พิมพ์ใบปะหน้า (QR)</button>
    <button id="copyBtn-${esc(d.no)}" onclick="copyLink('${esc(d.no)}')" class="text-sm border border-slate-300 rounded-lg px-3 py-2 hover:bg-slate-50">🔗 คัดลอกลิงก์ติดตาม</button>
   </div></div>`;
}
function detail(no){
  const d=ROWS.find(x=>x.no===no); if(!d) return;
  openM(docCardHTML(d,false));
}
/* ══════════ หน้าติดตามเฉพาะเรื่อง (เปิดจาก QR) ══════════ */
function renderTrackView(){
  const d=ROWS.find(x=>x.no===TRACK_NO);
  document.title='ติดตามหนังสือ '+TRACK_NO+' | DocTrack';
  if(!d){
    trackView.innerHTML=`<div class="card p-6 text-center">
     <div class="text-4xl mb-2">🔎</div>
     <div class="font-bold text-slate-700 mb-1">ไม่พบหนังสือเลขที่ "${esc(TRACK_NO)}"</div>
     <p class="text-sm text-slate-500">ลองรีเฟรช หรือตรวจสอบว่าลิงก์/QR ถูกต้อง</p>
     <button onclick="loadData()" class="mt-3 text-sm border border-slate-300 rounded-lg px-3 py-2 hover:bg-slate-50">🔄 รีเฟรช</button></div>`;
    return;
  }
  trackView.innerHTML=`<div class="flex items-center gap-2 text-xs text-slate-500 mb-3">
    <span class="w-2 h-2 rounded-full bg-emerald-500 pulse"></span>
    <span>ติดตามแบบเรียลไทม์ · อัปเดตล่าสุด ${new Date().toLocaleTimeString('th-TH')}</span></div>
   ${docCardHTML(d,true)}`;
}
/* ══════════ ใบปะหน้า + QR CODE ══════════ */
function printCover(no){
  const d=ROWS.find(x=>x.no===no); if(!d) return;
  const url=trackLink(d.no);
  coverSheet.innerHTML=`<div style="max-width:480px;margin:24px auto;padding:28px;border:2px solid #0f2d5c;border-radius:12px;font-family:'Sarabun',sans-serif">
   <div style="text-align:center;margin-bottom:14px">
    <div style="font-weight:700;font-size:15px;color:#0f2d5c">ใบปะหน้าติดตามสถานะหนังสือ</div>

   <div class="qrbox" id="qrPrintBox" style="display:flex;justify-content:center;padding:12px 0"></div>

    <span style="font-family:monospace">${esc(url)}</span></div></div>`;
  const box=document.getElementById('qrPrintBox'); box.innerHTML='';
  new QRCode(box,{text:url,width:170,height:170,correctLevel:QRCode.CorrectLevel.M});

window.addEventListener('afterprint',()=>document.body.classList.remove('printing-cover'));
/* ══════════ คัดลอกลิงก์ติดตาม ══════════ */
function copyLink(no){
  const url=trackLink(no), btn=document.getElementById('copyBtn-'+no);
  navigator.clipboard.writeText(url).then(()=>{
    if(btn){ const t=btn.textContent; btn.textContent='✅ คัดลอกแล้ว'; setTimeout(()=>btn.textContent=t,1500); }
  }).catch(()=>{ if(btn) btn.textContent='ลิงก์: '+url; });
}
function exportCSV(){
  const head=['หมายเลขหนังสือ','เรื่อง','ประเภท','วันที่เริ่มงาน','วันที่งานสำเร็จ','สถานะ','ขั้นตอนปัจจุบัน','ผ่านมา (วัน)','กำหนด (วัน)','เกินกำหนด (วัน)','สถานะเวลา'];
  const csv='\uFEFF'+[head.join(',')].concat(ROWS.map(d=>[d.no,d.subject,d.type,fmt(d.start),d.end?fmt(d.end):'',
   d.status,d.where,d.days,d.sla,d.over,d.timeState].map(x=>`"${String(x??'')}"`).join(','))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='doctrack_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}
loadData();
setInterval(()=>{ if(!document.hidden) loadData(); }, 60000);
